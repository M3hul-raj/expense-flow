name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip check

      - name: Run pytest
        run: pytest tests/ -v

  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: expenseflow
          POSTGRES_PASSWORD: ci_test_only_password
          POSTGRES_DB: expenseflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U expenseflow -d expenseflow_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock -r requirements-postgres.lock
          pip check

      - name: Run pytest against PostgreSQL 16
        env:
          EXPENSEFLOW_TEST_DATABASE_URI: postgresql+psycopg://expenseflow:ci_test_only_password@127.0.0.1:5432/expenseflow_test
        run: pytest tests/ -v
